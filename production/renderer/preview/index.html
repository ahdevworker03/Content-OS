<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal carousel template preview</title>
    <style>
      body { margin: 24px; background: #eee6dd; color: #2a2521; font: 16px sans-serif; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
      figure { margin: 0; }
      img { display: block; width: 100%; height: auto; }
      figcaption { padding: 8px 0; }
    </style>
  </head>
  <body>
    <h1>Personal carousel layout preview</h1>
    <main>
      <figure><img src="personal-carousel/slide-01.png" alt="Cover slide at 1080 by 1080" /><figcaption>Cover</figcaption></figure>
      <figure><img src="personal-carousel/slide-02.png" alt="Story slide at 1080 by 1080" /><figcaption>Story</figcaption></figure>
      <figure><img src="personal-carousel/slide-03.png" alt="Focus slide at 1080 by 1080" /><figcaption>Focus</figcaption></figure>
      <figure><img src="personal-carousel/slide-04.png" alt="Sequence slide at 1080 by 1080" /><figcaption>Sequence</figcaption></figure>
      <figure><img src="personal-carousel/slide-05.png" alt="Comparison slide at 1080 by 1080" /><figcaption>Comparison</figcaption></figure>
      <figure><img src="personal-carousel/slide-06.png" alt="Evidence slide with a conceptual diagram at 1080 by 1080" /><figcaption>Evidence</figcaption></figure>
      <figure><img src="personal-carousel/slide-07.png" alt="Closing slide at 1080 by 1080" /><figcaption>Closing</figcaption></figure>
    </main>
  </body>
</html>
